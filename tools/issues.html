<!-- File: tools/issues.html - Issue manager tool UI. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />

  <meta name="mobile-web-app-capable" content="yes" />
  <title>Issue Manager</title>
  <link rel="stylesheet" href="/assets/ui.css?v=20260204_2">
</head>
<body>
  <header class="toolbar">
    <button id="menuBtn" aria-label="Open menu" aria-expanded="false">☰</button>
    <div class="brand">Issue Manager</div>
    <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
      <span id="selectedCount" class="muted" aria-live="polite">0 selected</span>
      <label style="display:flex;align-items:center;gap:6px;padding:6px 10px;">
        <input id="selectAllIssues" type="checkbox" aria-label="Select all issues">
        <span>Select all</span>
      </label>
      <button id="deleteSelectedBtn" class="btn btnDanger" disabled>Delete selected</button>
    </div>
  </header>

  <!-- off-canvas menu -->
  <div id="menuBackdrop" style="position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:99998;"></div>
  <nav id="offcanvasMenu" role="navigation" aria-label="Site" aria-hidden="true" style="position:fixed;left:-280px;top:0;bottom:0;width:260px;background:rgba(2,6,10,.95);padding:18px;z-index:99999;box-shadow: 6px 0 30px rgba(0,0,0,.6);transition:left .22s ease;">
    <button id="menuClose" class="iconBtn" style="margin-bottom:12px" aria-label="Close menu">×</button>
    <div style="display:flex;flex-direction:column;gap:8px;margin-top:6px;">
      <a class="tool-card" href="/" style="background:none;box-shadow:none;border:none;padding:8px;color:var(--text);text-decoration:none">Home</a>
      <a class="tool-card" href="/tools/index.html" style="background:none;box-shadow:none;border:none;padding:8px;color:var(--text);text-decoration:none">Tools</a>
      <a class="tool-card" href="/exports.html" style="background:none;box-shadow:none;border:none;padding:8px;color:var(--text);text-decoration:none">Exports</a>
      <a class="tool-card" href="/tools/issues.html" style="background:none;box-shadow:none;border:none;padding:8px;color:var(--text);text-decoration:none">Issue Manager</a>
    </div>
  </nav>

  <main style="padding:16px;">
    <div class="card">
      <h2>All issues</h2>
      <div id="issuesList" aria-busy="false" role="status" aria-live="polite">Loading…</div>
    </div>
  </main>

  <style>
    /* Issue list styles */
    #issuesList table {
      width: 100%;
      border-collapse: collapse;
    }
    #issuesList th, #issuesList td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    #issuesList th {
      font-weight: 700;
      color: var(--neon);
    }
    #issuesList tr:hover {
      background: rgba(0,255,231,0.04);
    }
    .issue-check {
      width: 18px;
      height: 18px;
      accent-color: #ff6b6b;
      cursor: pointer;
    }
    .btnDanger {
      background: linear-gradient(90deg, #ff6b6b, #ff3b3b);
      color: #041013;
      border: none;
      padding: 8px 12px;
      border-radius: 10px;
      font-weight: 800;
    }
    .btnDanger:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .delIssue {
      background: rgba(255, 107, 107, 0.1);
      border: 1px solid rgba(255, 107, 107, 0.3);
      color: #ff7b7b;
      padding: 6px 10px;
      border-radius: 8px;
      cursor: pointer;
    }
    .delIssue:hover {
      background: rgba(255, 107, 107, 0.2);
    }
  </style>

  <script>
    // Small helper for safe text
    function txt(v){ return (v === null || v === undefined) ? '' : String(v); }

    const selectedIssueIds = new Set();

    function updateBulkControls(totalIssues = 0) {
      const selectAll = document.getElementById('selectAllIssues');
      const deleteBtn = document.getElementById('deleteSelectedBtn');
      const selectedLabel = document.getElementById('selectedCount');
      const selectedCount = selectedIssueIds.size;
      
      deleteBtn.disabled = selectedCount === 0;
      if (selectedLabel) selectedLabel.textContent = selectedCount + ' selected';
      
      if (totalIssues === 0) {
        selectAll.checked = false;
        selectAll.indeterminate = false;
        return;
      }
      
      if (selectedCount === 0) {
        selectAll.checked = false;
        selectAll.indeterminate = false;
      } else if (selectedCount === totalIssues) {
        selectAll.checked = true;
        selectAll.indeterminate = false;
      } else {
        selectAll.checked = false;
        selectAll.indeterminate = true;
      }
    }

    async function deleteIssue(id, plan) {
      if (!confirm('Delete issue ' + id + ' and all associated photos?')) return;

      try{
        const resp = await fetch('/api/delete_issue_with_photos.php', {
          method: 'POST',
          headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
          body: JSON.stringify({ id, plan_id: plan })
        });

        const raw = await resp.text();
        let resj;
        try { resj = JSON.parse(raw); } catch { resj = null; }

        if (!resp.ok || !resj || !resj.ok) {
          throw new Error((resj && resj.error) ? resj.error : ('HTTP ' + resp.status));
        }

        // show undo snackbar
        showUndoSnack('Issue deleted', 'Undo', async ()=>{
          const trash = resj.trash;
          if(!trash) throw new Error('No trash info returned');
          const r = await fetch('/api/restore_trash.php', {
            method:'POST',
            headers:{ 'Content-Type':'application/json', 'Accept':'application/json' },
            body: JSON.stringify({ trash })
          });
          const raw2 = await r.text();
          let jr;
          try { jr = JSON.parse(raw2); } catch { jr = null; }
          if(!r.ok || !jr || !jr.ok) throw new Error((jr && jr.error) ? jr.error : ('HTTP ' + r.status));
          await loadIssues();
        });

        await loadIssues();
      } catch(e) {
        alert('Delete failed: ' + e.message);
      }
    }

    async function deleteSelectedIssues() {
      if (selectedIssueIds.size === 0) return;
      
      if (!confirm(`Delete ${selectedIssueIds.size} issue(s) and all associated photos?`)) return;
      
      const ids = Array.from(selectedIssueIds);
      const failures = [];
      
      for (const {id, plan} of ids) {
        try{
          const resp = await fetch('/api/delete_issue_with_photos.php', {
            method: 'POST',
            headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
            body: JSON.stringify({ id, plan_id: plan })
          });
          const raw = await resp.text();
          let resj;
          try { resj = JSON.parse(raw); } catch { resj = null; }
          if (!resp.ok || !resj || !resj.ok) failures.push(id);
        }catch(e){ failures.push(id); }
      }
      
      if (failures.length) {
        alert(`Failed to delete ${failures.length} issue(s).`);
      } else {
        showUndoSnack(`Deleted ${ids.length} issue(s)`);
      }
      
      selectedIssueIds.clear();
      await loadIssues();
    }

    async function loadIssues(){
      const wrap = document.getElementById('issuesList');
      wrap.setAttribute('aria-busy', 'true');
      wrap.textContent = 'Loading…';

      try{
        const res = await fetch('/api/list_issues.php', {
          headers: { 'Accept': 'application/json' },
          cache: 'no-store'
        });

        const raw = await res.text();
        let data;
        try { data = JSON.parse(raw); }
        catch {
          throw new Error('API did not return JSON. First chars: ' + raw.slice(0,120));
        }

        if (!res.ok) throw new Error('HTTP ' + res.status + (data && data.error ? (': ' + data.error) : ''));
        if (!data.ok) throw new Error(data.error || 'unknown');

        if (!Array.isArray(data.issues) || data.issues.length === 0) {
          wrap.innerHTML = '<div>No issues found</div>';
          wrap.setAttribute('aria-busy', 'false');
          return;
        }

        // Build table safely (no innerHTML with user content)
        const table = document.createElement('table');
        table.setAttribute('aria-label', 'Issue list');
        table.style.width = '100%';
        table.style.borderCollapse = 'collapse';

        const thead = document.createElement('thead');
        const hr = document.createElement('tr');
        
        // Checkbox column header
        const thCheck = document.createElement('th');
        thCheck.style.width = '40px';
        const checkAll = document.createElement('input');
        checkAll.type = 'checkbox';
        checkAll.className = 'issue-check';
        checkAll.id = 'selectAllIssues';
        checkAll.setAttribute('aria-label', 'Select all issues');
        thCheck.appendChild(checkAll);
        hr.appendChild(thCheck);
        
        ['ID','Plan','Page','Title','Coords','Photos','Actions'].forEach(h=>{
          const th = document.createElement('th');
          th.setAttribute('scope','col');
          th.textContent = h;
          hr.appendChild(th);
        });
        thead.appendChild(hr);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        const frag = document.createDocumentFragment();
        const issueIds = new Set();

        for (const iss of data.issues) {
          issueIds.add(Number(iss.id));
          const tr = document.createElement('tr');

          // Checkbox column
          const tdCheck = document.createElement('td');
          const checkWrap = document.createElement('label');
          checkWrap.style.display = 'flex';
          checkWrap.style.alignItems = 'center';
          const check = document.createElement('input');
          check.type = 'checkbox';
          check.className = 'issue-check';
          check.checked = selectedIssueIds.has(Number(iss.id));
          check.setAttribute('aria-label', `Select issue ${txt(iss.id)}`);
          check.addEventListener('change', () => {
            const issueData = { id: Number(iss.id), plan: Number(iss.plan_id) };
            if (check.checked) {
              selectedIssueIds.add(issueData);
            } else {
              selectedIssueIds.delete(issueData);
            }
            updateBulkControls(issueIds.size);
          });
          checkWrap.appendChild(check);
          tdCheck.appendChild(checkWrap);
          tr.appendChild(tdCheck);

          const tdId = document.createElement('td');
          tdId.textContent = txt(iss.id);
          tr.appendChild(tdId);

          const tdPlan = document.createElement('td');
          tdPlan.textContent = txt(iss.plan_name || iss.plan_id);
          tr.appendChild(tdPlan);

          const tdPage = document.createElement('td');
          tdPage.textContent = txt(iss.page);
          tr.appendChild(tdPage);

          const tdTitle = document.createElement('td');
          tdTitle.textContent = txt(iss.title);
          tr.appendChild(tdTitle);

          const tdCoords = document.createElement('td');
          if (iss.x_norm !== null && iss.y_norm !== null && iss.x_norm !== undefined && iss.y_norm !== undefined) {
            const x = Number(iss.x_norm);
            const y = Number(iss.y_norm);
            tdCoords.textContent = (Number.isFinite(x) && Number.isFinite(y)) ? (x.toFixed(2) + ', ' + y.toFixed(2)) : '';
          } else {
            tdCoords.textContent = '';
          }
          tr.appendChild(tdCoords);

          const tdPhotos = document.createElement('td');
          tdPhotos.id = 'ph-' + txt(iss.id);
          tdPhotos.textContent = 'Loading…';
          tr.appendChild(tdPhotos);

          const tdActions = document.createElement('td');
          const delBtn = document.createElement('button');
          delBtn.className = 'delIssue';
          delBtn.type = 'button';
          delBtn.textContent = 'Delete';
          delBtn.dataset.id = txt(iss.id);
          delBtn.dataset.plan = txt(iss.plan_id);
          delBtn.setAttribute('aria-label', 'Delete issue ' + txt(iss.id));
          tdActions.appendChild(delBtn);
          tr.appendChild(tdActions);

          frag.appendChild(tr);
        }
        tbody.appendChild(frag);
        table.appendChild(tbody);
        wrap.innerHTML = '';
        wrap.appendChild(table);
        
        // Restore any previously selected issues that are still in the list
        for (const selected of Array.from(selectedIssueIds)) {
          if (!issueIds.has(selected.id)) {
            selectedIssueIds.delete(selected);
          }
        }
        updateBulkControls(issueIds.size);
        wrap.setAttribute('aria-busy', 'false');

        // Fetch photo counts per plan to reduce requests
        const issuesByPlan = new Map();
        for (const iss of data.issues) {
          const pid = txt(iss.plan_id);
          if (!issuesByPlan.has(pid)) issuesByPlan.set(pid, []);
          issuesByPlan.get(pid).push(iss);
        }
        for (const [pid, issues] of issuesByPlan.entries()) {
          try{
            const r = await fetch(`/api/list_photos.php?plan_id=${encodeURIComponent(pid)}`, {
              headers: { 'Accept':'application/json' },
              cache: 'no-store'
            });
            const raw2 = await r.text();
            let j;
            try { j = JSON.parse(raw2); } catch { j = null; }
            const counts = {};
            if (j && j.ok && Array.isArray(j.photos)) {
              for (const ph of j.photos) {
                const key = txt(ph.issue_id);
                if (!key) continue;
                counts[key] = (counts[key] || 0) + 1;
              }
            }
            for (const iss of issues) {
              const phWrap = document.getElementById('ph-' + txt(iss.id));
              if (!phWrap) continue;
              const c = counts[txt(iss.id)] || 0;
              phWrap.textContent = c + ' photo(s)';
            }
          } catch(e) {
            for (const iss of issues) {
              const phWrap = document.getElementById('ph-' + txt(iss.id));
              if (phWrap) phWrap.textContent = '0';
            }
          }
        }

      } catch(e) {
        wrap.textContent = 'Failed to load: ' + e.message;
        wrap.setAttribute('aria-busy', 'false');
        console.error(e);
      }
    }

    // Event delegation for delete buttons (works after reload)
    document.addEventListener('click', async (ev) => {
      const btn = ev.target && ev.target.closest ? ev.target.closest('.delIssue') : null;
      if (!btn) return;

      const id = parseInt(btn.dataset.id, 10);
      const plan = parseInt(btn.dataset.plan, 10);
      if (!Number.isFinite(id) || !Number.isFinite(plan)) return alert('Bad issue id / plan id');

      deleteIssue(id, plan);
    });

    // Select all checkbox handler (header checkbox)
    document.addEventListener('DOMContentLoaded', () => {
      const selectAll = document.getElementById('selectAllIssues');
      if (selectAll) {
        selectAll.addEventListener('change', (event) => {
          const checks = document.querySelectorAll('.issue-check:not(#selectAllIssues)');
          if (!checks.length) return;
          
          if (event.target.checked) {
            checks.forEach((check) => {
              check.checked = true;
              const tr = check.closest('tr');
              if (tr) {
                const idCell = tr.cells[1]; // ID is in second column (index 1)
                const planCell = tr.cells[2]; // Plan is in third column (index 2)
                if (idCell && planCell) {
                  const id = parseInt(txt(idCell.textContent), 10);
                  const plan = parseInt(txt(planCell.textContent), 10);
                  if (Number.isFinite(id) && Number.isFinite(plan)) {
                    selectedIssueIds.add({ id, plan });
                  }
                }
              }
            });
          } else {
            checks.forEach((check) => { check.checked = false; });
            selectedIssueIds.clear();
          }
          
          // Get total from table rows (excluding header)
          const total = document.querySelectorAll('#issuesList tbody tr').length;
          updateBulkControls(total);
        });
      }
      
      // Delete selected button handler
      const deleteBtn = document.getElementById('deleteSelectedBtn');
      if (deleteBtn) {
        deleteBtn.addEventListener('click', deleteSelectedIssues);
      }
    });

    /* Snackbar */
    function showUndoSnack(message, undoLabel, undoCb) {
      let sb = document.getElementById('snackbar');
      if (!sb) {
        sb = document.createElement('div');
        sb.id = 'snackbar';
        sb.setAttribute('role','status');
        sb.setAttribute('aria-live','polite');
        sb.style.position = 'fixed';
        sb.style.left = '50%';
        sb.style.transform = 'translateX(-50%)';
        sb.style.bottom = '20px';
        sb.style.zIndex = 99999;
        sb.style.background = 'linear-gradient(90deg, rgba(6,56,56,0.95), rgba(0,255,160,0.06))';
        sb.style.color = '#fff';
        sb.style.padding = '12px 16px';
        sb.style.borderRadius = '10px';
        sb.style.boxShadow = '0 12px 30px rgba(0,0,0,.5)';
        sb.style.display = 'flex';
        sb.style.gap = '12px';
        sb.style.alignItems = 'center';
        document.body.appendChild(sb);
      }

      sb.innerHTML = '';
      const t = document.createElement('div');
      t.textContent = message;
      sb.appendChild(t);

      if (undoCb) {
        const undo = document.createElement('button');
        undo.className = 'btnPrimary';
        undo.type = 'button';
        undo.textContent = undoLabel || 'Undo';
        undo.onclick = async ()=>{
          try { await undoCb(); }
          catch(e){ alert('Undo failed: ' + (e.message || 'unknown')); }
          sb.style.display = 'none';
        };
        sb.appendChild(undo);
      }

      sb.style.display = 'flex';
      clearTimeout(sb._timeout);
      sb._timeout = setTimeout(()=>{ sb.style.display='none'; }, 8000);
    }

    /* Off-canvas menu handling */
    (function initMenu(){
      const off = document.getElementById('offcanvasMenu');
      const backdrop = document.getElementById('menuBackdrop');
      const menuBtn = document.getElementById('menuBtn');
      
      function setMenu(open){
        document.body.classList.toggle('offcanvas-open', open);
        off.style.left = open ? '0' : '-280px';
        off.setAttribute('aria-hidden', open ? 'false' : 'true');
        if (menuBtn) menuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
      }
      
      if (menuBtn) menuBtn.onclick = ()=> setMenu(true);
      
      const closeBtn = document.getElementById('menuClose');
      if (closeBtn) closeBtn.onclick = ()=> setMenu(false);
      if (backdrop) backdrop.onclick = ()=> setMenu(false);
      document.addEventListener('keydown', (ev)=>{ if(ev.key === 'Escape') setMenu(false); });
      
      // Close menu when clicking a link
      off.querySelectorAll('a').forEach((link)=> {
        link.addEventListener('click', ()=> setMenu(false));
      });
    })();

    // Start
    loadIssues();
  </script>
</body>
</html>
